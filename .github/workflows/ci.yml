name: Noteforge checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore Noteforge.slnx
      - run: dotnet build Noteforge.slnx --configuration Release --no-restore
      - run: dotnet test Noteforge.slnx --configuration Release --no-build
      - run: dotnet publish server/Noteforge.Web --configuration Release --no-build --output artifacts/web
